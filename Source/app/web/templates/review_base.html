<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Оцените приём — IshMed{% endblock %}</title>
  <style>
    /* CSS встроен намеренно: страницу открывают с телефона в коридоре клиники,
       и лишний сетевой запрос за стилями там дороже пары килобайт разметки. */
    :root {
      --bg: #fdfdfb; --card: #fff; --ink: #17191c; --muted: #5f636b;
      --faint: #8b9098; --line: #e5e7e2; --accent: #0b7a64; --accent-soft: #d9f0e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { max-width: 460px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .brand svg { width: 26px; height: 26px; }
    .brand b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 4px; }
    .where { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
    label { display: block; }
    .q { font-size: 15px; font-weight: 550; margin: 0 0 10px; }
    .hint { color: var(--faint); font-size: 13px; margin: 6px 0 0; }

    /* Оценка крупными кнопками: палец на телефоне, а не курсор */
    .stars { display: flex; gap: 8px; }
    .stars input { position: absolute; opacity: 0; width: 0; height: 0; }
    .stars label {
      flex: 1; aspect-ratio: 1; display: grid; place-items: center; cursor: pointer;
      border: 1px solid var(--line); border-radius: 16px; font-size: 20px; font-weight: 600;
      background: #fff; transition: all .15s cubic-bezier(.2,.9,.25,1);
    }
    .stars input:checked + label { background: var(--accent); border-color: var(--accent); color: #fff; }
    .stars input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips input { position: absolute; opacity: 0; width: 0; height: 0; }
    .chips label {
      cursor: pointer; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
      font-size: 14px; background: #fff; transition: all .15s;
    }
    .chips input:checked + label { background: var(--accent-soft); border-color: var(--accent); color: #05372d; }
    .chips input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

    textarea, input[type=tel] {
      width: 100%; font: inherit; padding: 11px 13px; border: 1px solid var(--line);
      border-radius: 14px; background: #fff; color: var(--ink); resize: vertical;
    }
    textarea:focus-visible, input[type=tel]:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    }
    button {
      width: 100%; font: inherit; font-weight: 600; padding: 14px; border: 0;
      border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .cb { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--muted); }
    .cb input { width: 18px; height: 18px; accent-color: var(--accent); }
    .note { color: var(--faint); font-size: 12.5px; line-height: 1.45; margin-top: 20px; }
    .hp { position: absolute; left: -9999px; }
    .done { text-align: center; padding: 40px 20px; }
    .done .ico { font-size: 40px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b7a64" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12h3.5l2-4.5 3 9 2.5-6 1.5 3H21"/>
      </svg>
      <b>IshMed</b>
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
