# nginx для IshMed на ishmed.ezgupro.uz
#
# Поддомены:
#   ishmed.ezgupro.uz      — лендинг, статика /var/www/ishmed. Заливает основатель.
#   app.ishmed.ezgupro.uz  — кабинет клиники: React из /var/www/ishmed-app + /api
#   api.ishmed.ezgupro.uz  — только API, без интерфейса
#
# TLS-блоки описаны ЗДЕСЬ, а не дописываются certbot'ом. Причина: deploy.sh
# перезаписывает этот файл при каждой раскладке, и правки certbot --nginx
# однажды уже были затёрты вместе с прослушиванием 443. Поэтому certbot
# работает в режиме certonly (webroot) и ведёт только файлы сертификата.
# Один хозяин на один файл.
#
# nginx на Ubuntu 24.04 — версия 1.24, где директива «http2 on;» ещё не
# поддерживается: включаем http2 параметром listen, один раз на сокет.

# Запросы с чужим или пустым Host (сканеры по IP) закрываем без ответа.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    # http2 задаётся один раз на слушающий сокет — здесь, в первом блоке.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/ishmed.ezgupro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ishmed.ezgupro.uz/privkey.pem;
    return 444;
}

# ── HTTP: только ACME и редирект на HTTPS ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ishmed.ezgupro.uz www.ishmed.ezgupro.uz
                app.ishmed.ezgupro.uz api.ishmed.ezgupro.uz;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── Лендинг ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ishmed.ezgupro.uz www.ishmed.ezgupro.uz;

    ssl_certificate     /etc/letsencrypt/live/ishmed.ezgupro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ishmed.ezgupro.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ishmed;
    index index.html;

    access_log /var/log/nginx/ishmed.access.log;
    error_log  /var/log/nginx/ishmed.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ =404; }
}

# ── Кабинет клиники ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.ishmed.ezgupro.uz;

    ssl_certificate     /etc/letsencrypt/live/ishmed.ezgupro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ishmed.ezgupro.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ishmed-app;
    index index.html;

    access_log /var/log/nginx/ishmed-app.access.log;
    error_log  /var/log/nginx/ishmed-app.error.log;

    # Клиника вставляет длинные тексты вакансий и надиктовывает аудио из браузера.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;          # кабинет во фрейм не встраиваем
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Имена файлов сборки содержат хэш, поэтому кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем никогда: иначе после деплоя браузер продолжит
    # грузить старый файл со ссылками на удалённые ассеты.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Распознавание речи и извлечение полей занимают секунды.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Публичная страница отзыва по QR. Отдаёт бэкенд серверным HTML, а не React:
    # пациент открывает её с телефона в коридоре клиники, и грузить туда всё
    # приложение ради одной формы незачем. Должна стоять ВЫШЕ общего location /,
    # иначе nginx отдаст index.html и пациент увидит пустой кабинет.
    location /r/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Страницу нельзя кэшировать: опрос могут закрыть, и наклейка должна
        # честно об этом сказать, а не показывать сохранённую форму.
        add_header Cache-Control "no-store" always;
    }

    # Служебная проверка отдаёт версию PostgreSQL и размер каталога —
    # наружу это не нужно.
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Маршрутизация на клиенте: любой неизвестный путь отдаёт index.html.
    location / { try_files $uri /index.html; }
}

# ── API без интерфейса ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ishmed.ezgupro.uz;

    ssl_certificate     /etc/letsencrypt/live/ishmed.ezgupro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ishmed.ezgupro.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ishmed-api.access.log;
    error_log  /var/log/nginx/ishmed-api.error.log;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # На этом поддомене интерфейса нет: отдавать index.html было бы обманом.
    location / { return 404; }
}
