[pytest]
asyncio_mode = auto

; Пул подключений — процессный синглтон. Если каждый тест получит свой event
; loop, пул окажется привязан к уже закрытому loop и упадёт на teardown.
; Поэтому и тесты, и фикстуры живут в одном loop на всю сессию.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
