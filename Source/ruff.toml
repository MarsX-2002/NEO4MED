# Линтер. Заведён после того, как ручной аудит нашёл ленивый импорт внутри
# функции и мёртвую функцию — то есть ровно то, что находится автоматически.
target-version = "py314"
line-length = 100
exclude = [".venv", "frontend", "__pycache__"]

[lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: неиспользуемое, необъявленное
    "I",         # порядок импортов
    "UP",        # устаревшие конструкции
    "B",         # bugbear: типичные ловушки
    "ASYNC",     # блокирующие вызовы в async
    "S",         # bandit: небезопасные места
    "C4", "SIM", # упрощения
    "RUF",
]
ignore = [
    "E501",      # длину строк держит форматтер, а не линтер
    "B008",      # Depends() в аргументах — идиома FastAPI
    "S101",      # assert в тестах уместен
    # Комментарии и строки интерфейса на русском — это решение, а не опечатка.
    "RUF001", "RUF002", "RUF003",
    # URL к Azure собирается из нашего же конфига, схема всегда https.
    "S310",
]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]   # тестовые пароли и данные
